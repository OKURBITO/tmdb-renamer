[package]
name = "tmdb_renamer"
version = "2.2.1"
edition = "2021"
description = "TMDB Media Library Smart Renamer (Windows Single-File GUI)"

[lib]
name = "tmdb_renamer"
path = "src/lib.rs"

[[bin]]
name = "tmdb_renamer"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = "0.29"
native-tls = "0.2"
rfd = { version = "0.15", default-features = false }
ureq = { version = "2.10", default-features = false, features = ["native-tls", "socks-proxy", "json", "gzip"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.10", default-features = false, features = ["tls", "socks-proxy", "json", "gzip"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
